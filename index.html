<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f172a'/><path d='M18 3L7 18h8l-1 11 11-15h-8l1-11z' fill='%23f59e0b'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS PWA Meta Tags & Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="СвітлоМапа" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <title>СвітлоМапа Львів — Графіки відключень на карті</title>
    <script>
      // Prevent iOS Safari from restoring off-screen scroll positions
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);

      // Auto-reload once if an outdated chunk fails to load
      window.addEventListener('error', function (e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var key = 'asset_retry_' + (e.target.src || e.target.href);
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen min-h-[100dvh] antialiased overflow-hidden">
    <div id="root"></div>

    <!-- Mobile orientation lock screen (active only on phones turned to landscape) -->
    <div id="orientation-blocker" class="fixed inset-0 z-[99999] bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-6 text-center select-none" style="display: none;">
      <div class="w-16 h-16 mb-4 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400 shadow-xl">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
          <path d="M12 18h.01"/>
        </svg>
      </div>
      <h2 class="text-base font-bold text-white mb-1.5 tracking-wide">Поверніть пристрій вертикально</h2>
      <p class="text-xs text-slate-400 max-w-xs leading-relaxed">СвітлоМапа оптимізована для портретного режиму для зручного перегляду карти та розкладу</p>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
